[project]
name = "shor-braket"
version = "0.1.0"
description = "Shor's algorithm for N=6 on local simulator and Amazon Braket, gated by simulator validation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Syota Sasaki", email = "syota.sasaki@earthsea-wizard.com" }]

dependencies = [
    "amazon-braket-sdk>=1.80",
    "amazon-braket-default-simulator>=1.23",
    "boto3>=1.34",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.scripts]
shor-braket = "shor_braket.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
# hatchling >= 1.27 is required for PEP 639 (license = "<SPDX>" / license-files)
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shor_braket"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "ANN", "SIM"]
ignore = ["D203", "D213", "ANN101", "ANN102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["braket.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not aws'"
markers = [
    "slow: takes more than a few seconds",
    "aws: requires AWS credentials and MAY INCUR COST (deselected by default)",
]
